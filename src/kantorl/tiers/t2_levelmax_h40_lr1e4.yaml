# Continuation of the retained best at a 40k horizon.
#
# The 60M run showed the 20,480-step cap binding: Route 3 trainers 6 and 7 have
# median first steps of 28,917 and 29,210 in the retained best, so training
# truncates most attempts before they arrive. More steps at 20k cannot fix that.
#
# This tier is t2_levelmax_h40 (40,960 max_steps, 20,480 stagnation) with the
# 1e-4 learning rate that stabilized the 31M -> 60M continuation. Seed it from
# the retained `best_model.zip` at 49,910,112, not the regressed 60M final.
name: t2_levelmax_h40_lr1e4

description: >
  Max-level potential at 4.0 with a 40,960-step horizon and 1e-4 learning rate.
  Same observation and reward as t2_levelmax; a longer life and gentler updates.

config:
  obs_components:
    - screens
    - health
    - level
    - badges
    - events
    - map
    - recent_actions
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24
  max_steps: 40960
  stagnation_steps: 20480
  stagnation_reward: 1.0

  reward_scale: 0.5
  explore_weight: 0.3
  interact_weight: 1.0
  interact_once_per_run: true
  stuck_penalty: 0.0
  level_weight: 4.0
  level_source: max
  heal_weight: 0.0

  gamma: 0.995
  target_kl: 0.02
  n_envs: 32
  learning_rate: 0.0001
  resume_learning_rate: 0.0001

  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 60000000
  reward_fn: default
  seed: 43
