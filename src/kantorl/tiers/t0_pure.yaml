# Tier 0 -- pixels and generic novelty only.
#
# The policy sees downscaled frames and nothing else. The reward is coordinate
# novelty: a generic "you have not been here before" signal that assumes
# nothing about Pokemon. No event flags, no badges, no exploration map, no
# action history.
#
# This tier is expected to fail, and that is the point. If it cannot leave the
# starting room, the failure marks where learning collapses once game-specific
# priors are removed. If it does make progress, every prior above it is
# optional.
name: t0_pure

description: >
  Pixels only, paid for visiting new coordinates. Closest to tabula rasa:
  the only game knowledge left is the action set and the frame rate.

config:
  obs_components: [screens]
  # Frame stack and screen size are held constant across tiers so the only
  # axis that changes is *which components* exist.
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24

  # Episode length, held equal across tiers so horizon is not a confound.
  #
  # 12,288 steps is ~1.4 in-game hours. The horizon has to fit inside the
  # training budget: at 2M steps across 32 envs each env only gets ~62k steps,
  # so a 163,840-step episode means no episode ever ends, novelty rewards never
  # refresh, and the signal is flat for ~62k steps. Measured: that configuration
  # trained three policies that were worse than uniform random.
  max_steps: 12288

  # ExplorationReward: +0.1 per new (map, x, y), +1.0 per new map.
  reward_scale: 1.0
  interact_weight: 1.0

  gamma: 0.995
  # Full training-loop throughput on the reference machine (8C/16T): 32 envs at
  # 1,214 steps/s beats 16 envs at 951, because workers idle during the PPO
  # update and oversubscription fills that gap. 48 envs regresses to 1,135 on
  # memory pressure. See scripts/bench_train.py.
  n_envs: 32
  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: exploration
  seed: 42
