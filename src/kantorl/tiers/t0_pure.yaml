# Tier 0 -- pixels only.
#
# The policy sees downscaled frames and nothing else. The reward is the same
# DefaultReward the other tiers use, with the same plumbing, so the ONLY
# difference between T0, T1 and T2 is which observation components exist.
#
# This tier previously used an exploration-only reward, which made it differ
# from the others in two ways at once and confounded the ablation: the only
# clean comparison was T1 vs T2. Moving the reward axis out (and measuring it
# separately) makes T0 a real third point on the observation axis.
#
# This tier is expected to be the weakest. If it keeps pace, the RAM oracles
# above it are optional.
name: t0_pure

description: >
  Pixels only, with the same reward, horizon and plumbing as the other tiers.
  The minimal-observation arm of the ablation.

config:
  obs_components: [screens]
  # Frame stack and screen size are held constant across tiers so the only
  # axis that changes is *which components* exist.
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24

  # Episode length, held equal across tiers so horizon is not a confound.
  #
  # The cap is deliberately longer than the stagnation window below, so a
  # productive agent can keep going while a stalled one is cut short. Before
  # this, a 163,840-step cap against a 2M-step budget meant no episode ever
  # ended: novelty never refreshed and all three tiers trained policies worse
  # than uniform random.
  max_steps: 20480

  # End an episode that earns less than stagnation_reward in stagnation_steps.
  # Refreshes every reward that resets with the episode, instead of spending
  # ~10k steps on an agent that has stopped making progress.
  stagnation_steps: 10240
  stagnation_reward: 1.0

  # Identical to T1 and T2 so the observation is the only changed axis.
  reward_scale: 0.5
  explore_weight: 0.3
  interact_weight: 1.0
  stuck_penalty: 0.0
  level_weight: 1.0

  gamma: 0.995
  # Full training-loop throughput on the reference machine (8C/16T): 32 envs at
  # 1,214 steps/s beats 16 envs at 951, because workers idle during the PPO
  # update and oversubscription fills that gap. 48 envs regresses to 1,135 on
  # memory pressure. See scripts/bench_train.py.
  n_envs: 32
  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: default
  seed: 42
