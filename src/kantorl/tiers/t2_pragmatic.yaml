# Tier 2 -- the full RAM-rich observation.
#
# Seven components: screens, party HP, Fourier-encoded levels, badge flags,
# 2,560 event flags, the 48x48 exploration map, and the last three actions.
# Reward and horizon are identical to T1, so the only difference between the
# two tiers is which observation components exist. That is what makes the
# comparison an ablation rather than a story.
#
# Curriculum training is deliberately off here. Curriculum changes *where
# episodes start*, which is a separate axis from *what the policy sees*;
# enabling both at once would leave you unable to attribute a difference to
# either. Copy this file and set enable_curriculum: true to study it alone.
name: t2_pragmatic

description: >
  Full RAM-rich observation with the default reward. The reference point for
  measuring what each removed observation prior costs.

config:
  obs_components:
    - screens
    - health
    - level
    - badges
    - events
    - map
    - recent_actions
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24
  # Episode length, held equal across tiers so horizon is not a confound.
  # Longer than the stagnation window so a productive agent can keep going;
  # see t0_pure.yaml for the full reasoning.
  max_steps: 20480
  stagnation_steps: 10240
  stagnation_reward: 1.0

  reward_scale: 0.5
  explore_weight: 0.3
  # Pay for pressing A somewhere new; without it A is strictly bad.
  interact_weight: 1.0
  # Off: the stuck penalty also fires during dialogue and menus.
  stuck_penalty: 0.0
  # Capped sum of party levels, paid as a potential difference. Without it
  # battles are pure cost and every gym sits behind a level gap.
  level_weight: 1.0

  gamma: 0.995
  # Full training-loop throughput on the reference machine (8C/16T): 32 envs at
  # 1,214 steps/s beats 16 envs at 951, because workers idle during the PPO
  # update and oversubscription fills that gap. 48 envs regresses to 1,135 on
  # memory pressure. See scripts/bench_train.py.
  n_envs: 32

  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: default
  seed: 42
