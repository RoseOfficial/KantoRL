# Phase 0 screen: baseline arm.
#
# This is the clean from-scratch recipe (legacy seven-component observation,
# level_weight 4.0, explore_weight 0.3, 61,440 horizon, gamma 0.995) cut to
# 20M steps so the failure mode can be measured cheaply. It is the control
# for the three single-axis arms in docs/PREREGISTRATION_PHASE0.md. The
# 1e-4 -> 5e-5 drop was scheduled at 78M and is irrelevant here.
name: phase0_baseline

description: >
  Phase 0 control: the clean from-scratch ruleset at 20M. No warm start, no
  curriculum, no local map, no marker.

config:
  obs_components:
    - screens
    - health
    - level
    - badges
    - events
    - map
    - recent_actions
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24
  max_steps: 61440
  stagnation_steps: 30720
  stagnation_reward: 1.0

  reward_scale: 0.5
  explore_weight: 0.3
  interact_weight: 1.0
  interact_once_per_run: true
  stuck_penalty: 0.0
  level_weight: 4.0
  level_source: max
  heal_weight: 0.0

  gamma: 0.995
  target_kl: 0.02
  n_envs: 32
  learning_rate: 0.0001

  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: default
  seed: 43
