# Phase 2 ablation: PPO + tiles + archive.
#
# The combined arm. If either single change helps, this asks whether they
# compose. Same archive policy as phase2_archive50 and the same tile map as
# phase2_tiles.
name: phase2_tiles_archive50

description: >
  Phase 2 arm: control plus the learned local tile map and the archive at 50%
  resets. 20M steps.

config:
  obs_components:
    - screens
    - health
    - level
    - badges
    - events
    - map
    - local_tiles
    - recent_actions
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24
  max_steps: 61440
  stagnation_steps: 30720
  stagnation_reward: 1.0

  reward_scale: 0.5
  explore_weight: 3.0
  interact_weight: 1.0
  interact_once_per_run: true
  stuck_penalty: 0.0
  level_weight: 4.0
  level_source: max
  heal_weight: 0.0

  gamma: 0.995
  target_kl: 0.02
  n_envs: 32
  learning_rate: 0.0001

  recurrent: false
  enable_curriculum: true
  enable_hm_automation: false
  checkpoint_weight: 0.5
  max_pool_size: 50
  archive_on_new_map: true
  archive_cell_stride: 0
  archive_save_cooldown: 1000
  archive_per_env: true
  archive_require_progress: false
  archive_frontier_fraction: 0.5
  archive_recent_fraction: 0.3
  dynamic_episode_length: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: default
  seed: 43
