# Tier 1 -- pixels plus what a player can read off the HUD.
#
# Party HP is the one progress-relevant number that is continuously visible in
# normal play, so exposing it is barely a prior. Everything stronger is
# removed: no 2,560-bit event scoreboard, no exploration map, no badge flags,
# no action history.
#
# Progress is still communicated through the default reward, but the policy
# has to perceive the cause itself. This is the tier that answers the real
# question: does the agent play the game, or does it read the answer sheet?
name: t1_minimal

description: >
  Pixels plus party HP, with the default rewarded-progress signal. Removes the
  event-flag and map oracles while holding reward and horizon identical to T2.

config:
  obs_components: [screens, health]
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24
  # Episode length, held equal across tiers so horizon is not a confound.
  # 12,288 steps is ~1.4 in-game hours; see t0_pure.yaml for why the horizon
  # must fit inside the training budget rather than exceed it.
  max_steps: 20480
  stagnation_steps: 10240
  stagnation_reward: 1.0

  # Identical to T2 so the observation is the only changed axis.
  reward_scale: 0.5
  explore_weight: 0.3
  # Pay for pressing A somewhere new; without it A is strictly bad.
  interact_weight: 1.0
  # Off: the stuck penalty also fires during dialogue and menus.
  stuck_penalty: 0.0
  # Capped sum of party levels, paid as a potential difference. Without it
  # battles are pure cost and every gym sits behind a level gap.
  level_weight: 1.0
  # Off: losing battles to black out and heal is farmable.
  heal_weight: 0.0

  gamma: 0.995
  # Full training-loop throughput on the reference machine (8C/16T): 32 envs at
  # 1,214 steps/s beats 16 envs at 951, because workers idle during the PPO
  # update and oversubscription fills that gap. 48 envs regresses to 1,135 on
  # memory pressure. See scripts/bench_train.py.
  n_envs: 32
  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: default
  seed: 42
