# Ablation arm: screens + the visited-tile map, nothing else.
#
# The sensitivity probe showed the 48x48 map dominated the policy's attention
# while events, badges, levels and HP each moved it far less. This arm asks
# whether spatial memory accounts for the entire advantage of the full tier.
#
# Compared against screens alone (0/10 to Viridian City) and all seven
# components (10/10), same reward, horizon, start state and budget.
name: t2_screens_map

description: >
  Pixels plus the 48x48 visited-tile map. Tests whether spatial memory is the
  load-bearing observation prior.

config:
  obs_components: [screens, map]
  frame_stacks: 3
  screen_size: [72, 80]
  action_freq: 24
  max_steps: 20480
  stagnation_steps: 10240
  stagnation_reward: 1.0

  # Identical to t2_pragmatic so observation is the only changed axis.
  reward_scale: 0.5
  explore_weight: 0.3
  interact_weight: 1.0
  # Interaction novelty persists across episodes. Per-episode it paid again
  # every life, and the 100M gate settled into farming Pallet Town's NPCs.
  interact_once_per_run: true
  stuck_penalty: 0.0
  level_weight: 1.0
  heal_weight: 0.0

  gamma: 0.995
  # Stop a PPO epoch once approximate KL exceeds 1.5x this. Clip range bounds
  # each sample's ratio, not the whole update; a 0.093-KL update at 10M
  # flattened the 100M gate run and it never recovered.
  target_kl: 0.02
  n_envs: 32
  enable_curriculum: false
  enable_agent: false

train:
  total_timesteps: 20000000
  reward_fn: default
  seed: 42
